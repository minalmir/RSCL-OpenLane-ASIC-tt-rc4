# Tiny Tapeout project information
project:
  title:        "RC4 Stream Cipher"
  author:       "Minal Mir"
  discord:      ""
  description:  "Hardware implementation of the RC4 stream cipher."
  language:     "Verilog"
  clock_hz:     50000000

  # Start with the largest available size for testing.
  tiles: "8x2"

  top_module:  "tt_um_minalmir_rc4"

  source_files:
    - "project.v"
    - "rc4_v5.v"
    - "sarray.v"
    - "sarray_block.v"

# Pin descriptions
pinout:
  # Inputs: streamed key/plaintext data bus
  ui[0]: "Data bit 0"
  ui[1]: "Data bit 1"
  ui[2]: "Data bit 2"
  ui[3]: "Data bit 3"
  ui[4]: "Data bit 4"
  ui[5]: "Data bit 5"
  ui[6]: "Data bit 6"
  ui[7]: "Data bit 7"

  # Outputs: encrypted byte
  uo[0]: "Encrypted bit 0"
  uo[1]: "Encrypted bit 1"
  uo[2]: "Encrypted bit 2"
  uo[3]: "Encrypted bit 3"
  uo[4]: "Encrypted bit 4"
  uo[5]: "Encrypted bit 5"
  uo[6]: "Encrypted bit 6"
  uo[7]: "Encrypted bit 7"

  # Commands on uio[2:0]; remaining pins unused
  uio[0]: "Command bit 0"
  uio[1]: "Command bit 1"
  uio[2]: "Command bit 2"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
